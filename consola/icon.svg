<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bd6ff"/>
      <stop offset="1" stop-color="#b07bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- TV -->
  <rect x="96" y="104" width="320" height="214" rx="22" fill="#12152a" stroke="#3a4680" stroke-width="4"/>
  <rect x="120" y="128" width="272" height="166" rx="10" fill="url(#scr)" filter="url(#glow)"/>
  <text x="256" y="238" font-family="Orbitron, Arial, sans-serif" font-weight="900" font-size="92" fill="#06070f" text-anchor="middle">KMM</text>
  <!-- console unit -->
  <rect x="150" y="340" width="212" height="46" rx="14" fill="#171a2c" stroke="#3a4680" stroke-width="3"/>
  <circle cx="330" cy="363" r="10" fill="#35f0a0"/>
  <rect x="172" y="357" width="110" height="12" rx="6" fill="#05060d"/>
  <!-- stand -->
  <rect x="214" y="386" width="84" height="16" rx="6" fill="#0f1120"/>
</svg>
