      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- game controller -->
  <g fill="#ffffff">
    <rect x="120" y="196" width="272" height="150" rx="72" opacity="0.96" />
    <!-- d-pad -->
    <rect x="176" y="256" width="18" height="52" rx="6" fill="#4338ca" />
    <rect x="159" y="273" width="52" height="18" rx="6" fill="#4338ca" />
    <!-- buttons -->
    <circle cx="322" cy="258" r="13" fill="#ef4444" />
    <circle cx="352" cy="288" r="13" fill="#22c55e" />
    <circle cx="322" cy="318" r="13" fill="#f59e0b" />
    <circle cx="292" cy="288" r="13" fill="#0ea5e9" />
  </g>
</svg>
